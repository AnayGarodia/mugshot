<!doctype html>
<meta charset="utf-8">
<title>mugshot</title>
<style>
  body { font-family: ui-monospace, monospace; background: #f4f1ea; color: #1c1b1a; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
  h1 { font-weight: 600; }
  input { font: inherit; padding: 8px 12px; border: 1.5px solid #1c1b1a; background: transparent; border-radius: 6px; width: 240px; }
  #you svg { vertical-align: middle; }
  #grid { display: grid; grid-template-columns: repeat(8, 1fr); margin-top: 24px; }
  #grid svg { width: 100%; height: auto; cursor: pointer; }
  .hint { opacity: .55; font-size: 13px; }
</style>
<h1>mugshot</h1>
<p>Deterministic hand-drawn doodle avatars. Type anything — same string, same face, forever.</p>
<p><input id="seed" value="anay" autofocus> <span id="you"></span></p>
<p class="hint">click any face to reroll the grid · every face below is just <code>face("mug-" + i)</code></p>
<div id="grid"></div>
<script type="module">
  import { face } from "./dist/index.js";
  const grid = document.getElementById("grid");
  const seedEl = document.getElementById("seed");
  const you = document.getElementById("you");
  const draw = () => { you.innerHTML = face(seedEl.value, { size: 96 }); };
  seedEl.addEventListener("input", draw); draw();
  let batch = 0;
  const fill = () => {
    grid.innerHTML = "";
    for (let i = 0; i < 48; i++) grid.innerHTML += face(`mug-${batch}-${i}`, { size: 120 });
  };
  grid.addEventListener("click", () => { batch++; fill(); });
  fill();
</script>
