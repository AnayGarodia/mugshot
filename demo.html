<!doctype html>
<meta charset="utf-8">
<title>mugshot</title>
<style>
  body { font-family: ui-monospace, monospace; background: #f4f1ea; color: #1c1b1a; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
  h1 { font-weight: 600; margin-bottom: 4px; }
  button { font: inherit; font-size: 13px; background: transparent; border: 1.2px solid #1c1b1a; border-radius: 5px; padding: 3px 9px; cursor: pointer; margin: 2px 4px 2px 0; }
  input { font: inherit; padding: 8px 12px; border: 1.5px solid #1c1b1a; background: transparent; border-radius: 6px; width: 220px; }
  .hero { display: flex; gap: 28px; align-items: center; margin: 24px 0; }
  .hint { opacity: .55; font-size: 13px; }
  #grid { display: grid; grid-template-columns: repeat(8, 1fr); margin-top: 28px; }
  #grid svg { width: 100%; height: auto; cursor: pointer; }
</style>
<h1>mugshot</h1>
<p>Living doodle avatars. It's watching your cursor right now. Stop moving for 8s and it falls asleep.</p>
<div class="hero">
  <mug-shot id="mug" seed="anay" size="200" idle="8000" style="width:200px"></mug-shot>
  <div>
    <p><input id="seed" value="anay" placeholder="type a name…"> <span class="hint">it watches you type</span></p>
    <p>
      <button data-r="happy">ship it</button>
      <button data-r="grumpy">build failed</button>
      <button data-r="surprised">segfault</button>
      <button data-r="sad">rejected PR</button>
      <button data-r="wink">lgtm</button>
    </p>
    <p class="hint">buttons call <code>mug.react(mood)</code> — same face, new feeling</p>
  </div>
</div>
<p class="hint">every face is <code>face("mug-" + i)</code> — deterministic, zero deps. click the grid to reroll.</p>
<div id="grid"></div>
<script type="module">
  import { face } from "./dist/index.js";
  import "./dist/element.js";
  const mug = document.getElementById("mug");
  const seedEl = document.getElementById("seed");
  seedEl.addEventListener("input", () => mug.setAttribute("seed", seedEl.value || "mugshot"));
  document.querySelectorAll("[data-r]").forEach(b =>
    b.addEventListener("click", () => mug.react(b.dataset.r)));
  const grid = document.getElementById("grid");
  let batch = 0;
  const fill = () => {
    grid.innerHTML = "";
    for (let i = 0; i < 40; i++) grid.innerHTML += face(`mug-${batch}-${i}`, { size: 120 });
  };
  grid.addEventListener("click", () => { batch++; fill(); });
  fill();
</script>
